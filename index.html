<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightRides | Rides brought to LIGHT!</title>
    <!-- Favicon icon displayed in browser tab -->
    <link rel="icon" href="LightRides circle logo.png" type="image/png">
    
    <!-- Google Fonts Preconnect and Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Global theme color variables */
            --bg-color: #0b1329; /* Centered rich holiday royal blue gradient */
            --card-bg: rgba(22, 32, 51, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(0, 183, 255, 0.15);
            
            /* Brand Link Badge Colors */
            --crimson-color: #418F3B;
            --etsy-color: #f16521;
            --youtube-color: #ff0000;
            --patreon-color: #ff424d;
            --instagram-color: #e1306c;
            --discord-color: #5865f2;
        }

        /* CSS Reset for consistent margins and sizing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Page Body styling with a centered, lighter holiday blue gradient background */
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(30, 95, 180, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 50% 90%, rgba(20, 60, 130, 0.25) 0%, transparent 70%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Swagged Top Holiday Lights Styles --- */
        .swag-lights-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        /* SVG Swagged Green Cable */
        .swag-cable-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            pointer-events: none;
        }

        .swag-cable-path {
            fill: none;
            stroke: #1e4d2b;
            stroke-width: 3.5;
            stroke-linecap: round;
        }

        /* C9 Bulb Shape */
        .light-bulb {
            position: absolute;
            width: 14px;
            height: 22px;
            border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
            animation: pulse-glow 2s ease-in-out infinite alternate;
            transform-origin: top center;
        }

        /* Bulb Socket Base */
        .light-bulb::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 3px;
            width: 8px;
            height: 5px;
            background: #112616;
            border-radius: 2px;
        }

        /* C9 Color Variations */
        .bulb-red {
            background: #ff2a2a;
            box-shadow: 0 0 10px 3px rgba(255, 42, 42, 0.7), 0 0 20px 6px rgba(255, 0, 0, 0.3);
        }
        .bulb-orange {
            background: #ff7f00;
            box-shadow: 0 0 10px 3px rgba(255, 127, 0, 0.7), 0 0 20px 6px rgba(255, 100, 0, 0.3);
        }
        .bulb-yellow {
            background: #ffd700;
            box-shadow: 0 0 10px 3px rgba(255, 215, 0, 0.7), 0 0 20px 6px rgba(255, 200, 0, 0.3);
        }
        .bulb-green {
            background: #00cc44;
            box-shadow: 0 0 10px 3px rgba(0, 204, 68, 0.7), 0 0 20px 6px rgba(0, 180, 50, 0.3);
        }
        .bulb-blue {
            background: #00bfff;
            box-shadow: 0 0 10px 3px rgba(0, 191, 255, 0.7), 0 0 20px 6px rgba(0, 150, 255, 0.3);
        }

        @keyframes pulse-glow {
            0% {
                opacity: 0.55;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
        /* ----------------------------------------------- */

        /* --- Falling Snow Animation Styles --- */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(50vh) translateX(20px);
            }
            100% {
                transform: translateY(105vh) translateX(-20px);
            }
        }
        /* ------------------------------------- */

        /* Main Container Layout - Added top margin so banner sits below top swag lights */
        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            margin-top: 2.5rem; /* Pushes banner and content down beneath swag lights */
            z-index: 2;
        }

        /* Banner Logo Wrapper */
        .banner-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

            max-width
