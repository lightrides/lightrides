<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightRides | Rides brought to LIGHT!</title>
    <!-- Favicon icon displayed in browser tab -->
    <link rel="icon" href="LightRides circle logo.png" type="image/png">
    
    <!-- Google Fonts Preconnect and Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Global theme color variables */
            --bg-color: #0b1329; /* Centered rich holiday royal blue gradient */
            --card-bg: rgba(22, 32, 51, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(0, 183, 255, 0.15);
            
            /* Brand Link Badge Colors */
            --crimson-color: #418F3B;
            --etsy-color: #f16521;
            --youtube-color: #ff0000;
            --patreon-color: #ff424d;
            --instagram-color: #e1306c;
            --discord-color: #5865f2;
        }

        /* CSS Reset for consistent margins and sizing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Page Body styling with a centered, lighter holiday blue gradient background */
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(30, 95, 180, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 50% 90%, rgba(20, 60, 130, 0.25) 0%, transparent 70%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Swagged Top Holiday Lights Styles --- */
        .swag-lights-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 90px;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        /* SVG Swagged Green Cable */
        .swag-cable-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            pointer-events: none;
        }

        .swag-cable-path {
            fill: none;
            stroke: #1e4d2b;
            stroke-width: 3.5;
            stroke-linecap: round;
        }

        /* C9 Bulb Shape */
        .light-bulb {
            position: absolute;
            width: 14px;
            height: 22px;
            border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
            animation: pulse-glow 2s ease-in-out infinite alternate;
            transform-origin: top center;
        }

        /* Bulb Socket Base */
        .light-bulb::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 3px;
            width: 8px;
            height: 5px;
            background: #112616;
            border-radius: 2px;
        }

        /* C9 Color Variations */
        .bulb-red {
            background: #ff2a2a;
            box-shadow: 0 0 10px 3px rgba(255, 42, 42, 0.7), 0 0 20px 6px rgba(255, 0, 0, 0.3);
        }
        .bulb-orange {
            background: #ff7f00;
            box-shadow: 0 0 10px 3px rgba(255, 127, 0, 0.7), 0 0 20px 6px rgba(255, 100, 0, 0.3);
        }
        .bulb-yellow {
            background: #ffd700;
            box-shadow: 0 0 10px 3px rgba(255, 215, 0, 0.7), 0 0 20px 6px rgba(255, 200, 0, 0.3);
        }
        .bulb-green {
            background: #00cc44;
            box-shadow: 0 0 10px 3px rgba(0, 204, 68, 0.7), 0 0 20px 6px rgba(0, 180, 50, 0.3);
        }
        .bulb-blue {
            background: #00bfff;
            box-shadow: 0 0 10px 3px rgba(0, 191, 255, 0.7), 0 0 20px 6px rgba(0, 150, 255, 0.3);
        }

        @keyframes pulse-glow {
            0% {
                opacity: 0.55;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
        /* ----------------------------------------------- */

        /* --- Falling Snow Animation Styles --- */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(50vh) translateX(20px);
            }
            100% {
                transform: translateY(105vh) translateX(-20px);
            }
        }
        /* ------------------------------------- */

        /* Main Container Layout - Added top margin so banner sits below top swag lights */
        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            margin-top: 2.5rem; /* Pushes banner and content down beneath swag lights */
            z-index: 2;
        }

        /* Banner Logo Wrapper */
        .banner-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .site-banner {
            max-width: 340px;
            width: 80%;
            height: auto;
            filter: drop-shadow(0 0 25px var(--accent-glow));
            transition: transform 0.3s ease;
        }

        .site-banner:hover {
            transform: scale(1.02);
        }

        /* Two-Column Content Grid (Links on Left, Video on Right) */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            align-items: start;
        }

        /* Vertical Buttons List */
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            width: 100%;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 0.5rem 0.85rem 0.5rem 0.5rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-item:hover {
            transform: translateX(4px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }

        .btn-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.55rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-badge svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .link-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Brand Badge Color Classes */
        .bg-crimson { background-color: var(--crimson-color); }
        .bg-etsy { background-color: var(--etsy-color); }
        .bg-youtube { background-color: var(--youtube-color); }
        .bg-patreon { background-color: var(--patreon-color); }
        .bg-instagram { background-color: var(--instagram-color); }
        .bg-discord { background-color: var(--discord-color); }

        /* Video Card Styles */
        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 0.85rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        .card-header {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center; /* Centers the header text horizontally */
            gap: 0.5rem;
        }

        .aspect-ratio-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Maintains 16:9 ratio */
            height: 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        .aspect-ratio-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Horizontal Divider Line */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-border), transparent);
            margin: 0.5rem 0;
        }

        /* Brochure PDF Section */
        .brochure-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .brochure-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .document-window {
            width: 100%;
            height: 60vh;
            max-height: 650px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .fallback-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .fallback-container a {
            color: #00b7ff;
            text-decoration: underline;
        }

        /* Mobile Responsiveness (screens under 768px wide) */
        @media (max-width: 768px) {
            body {
                padding: 1.25rem 0.75rem;
            }

            .container {
                gap: 1.5rem;
                margin-top: 2rem;
            }

            .content-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .link-item {
                padding: 0.45rem 0.75rem 0.45rem 0.45rem;
            }

            .btn-badge {
                padding: 0.5rem 0.85rem;
                font-size: 0.8rem;
            }

            .link-desc {
                font-size: 0.75rem;
            }

            .document-window {
                height: 50vh;
            }
        }
    </style>
</head>
